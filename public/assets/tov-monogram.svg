    <!-- L3 -->
    <path d="M 160 255 Q 100 250 85 255 Q 115 285 180 275 Z" />
    <!-- L4 -->
    <path d="M 170 285 Q 110 290 85 305 Q 125 320 180 300 Z" />
    <!-- L5 (Bottom Left) -->
    <path d="M 180 310 Q 130 330 110 350 Q 150 350 185 325 Z" />
    
    <!-- Right Leaves -->
    <!-- R1 (Top) -->
    <path d="M 215 205 Q 250 200 265 185 Q 245 220 210 230 Z" />
    <!-- R2 -->
    <path d="M 225 225 Q 280 220 300 215 Q 270 250 215 250 Z" />
    <!-- R3 -->
